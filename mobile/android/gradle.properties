# Keep the daemon's native encoding: JDK 17 decodes Windows @argfiles using it.
# Forcing UTF-8 here corrupts non-ASCII test classpaths on GBK Windows systems.
org.gradle.jvmargs=-Xmx3072m
android.useAndroidX=true
# Allow Windows checkouts in non-ASCII directories (for example, a Chinese workspace path).
# This app does not use native CMake/NDK build steps, which can require ASCII-only paths.
android.overridePathCheck=true
kotlin.code.style=official
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
