name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build trusted Windows artifacts
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $expectedTag = "v$packageVersion"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag '$env:GITHUB_REF_NAME' does not match package version '$packageVersion'. Expected '$expectedTag'."
          }

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Check release readiness
        run: npm run release:check

      - name: Run development desktop tests
        id: development_tests
        run: npm run test:e2e

      - name: Upload development E2E diagnostics
        if: failure() && steps.development_tests.conclusion == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-development-e2e-diagnostics
          path: |
            artifacts/development/failure.json
            artifacts/development/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Build unpacked Windows application
        run: npm run pack

      - name: Verify unpacked application
        shell: pwsh
        run: |
          $appPath = 'dist\win-unpacked\截译 ScreenLingo.exe'
          $modelPath = 'dist\win-unpacked\resources\tessdata\eng.traineddata.gz'
          if (-not (Test-Path -LiteralPath $appPath -PathType Leaf)) {
            throw "Packaged application was not created at $appPath"
          }
          if (-not (Test-Path -LiteralPath $modelPath -PathType Leaf)) {
            throw "Bundled OCR model was not created at $modelPath"
          }

      - name: Run packaged desktop tests
        id: packaged_tests
        shell: pwsh
        env:
          SCREENLINGO_EXE: dist\win-unpacked\截译 ScreenLingo.exe
        run: npm run test:e2e

      - name: Upload packaged E2E diagnostics
        if: failure() && steps.packaged_tests.conclusion == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-packaged-e2e-diagnostics
          path: |
            artifacts/packaged/failure.json
            artifacts/packaged/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Build portable Windows executable
        run: npm run dist -- --publish never

      - name: Run portable application test
        id: portable_tests
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $env:SCREENLINGO_EXE = "dist\ScreenLingo-$version-x64.exe"
          node tests/e2e/portable.cjs

      - name: Upload portable E2E diagnostics
        if: failure() && steps.portable_tests.conclusion == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-portable-e2e-diagnostics
          path: |
            artifacts/portable/failure.json
            artifacts/portable/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Prepare release assets
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $portable = "dist\ScreenLingo-$version-x64.exe"
          $unpacked = 'dist\win-unpacked'
          $model = 'dist\win-unpacked\resources\tessdata\eng.traineddata.gz'
          $assetsDirectory = 'release-assets'
          $portableAsset = Join-Path $assetsDirectory (Split-Path -Leaf $portable)
          $zipAsset = Join-Path $assetsDirectory "ScreenLingo-$version-win-x64.zip"
          $checksums = Join-Path $assetsDirectory 'SHA256SUMS.txt'
          $releaseNotes = Join-Path $assetsDirectory 'release-notes.md'

          if (-not (Test-Path -LiteralPath $portable -PathType Leaf)) {
            throw "Portable executable was not created at $portable"
          }
          if (-not (Test-Path -LiteralPath $unpacked -PathType Container)) {
            throw "Unpacked application was not created at $unpacked"
          }
          if (-not (Test-Path -LiteralPath $model -PathType Leaf)) {
            throw "Bundled OCR model was not created at $model"
          }

          New-Item -ItemType Directory -Path $assetsDirectory | Out-Null
          Copy-Item -LiteralPath $portable -Destination $portableAsset
          Compress-Archive -Path $unpacked -DestinationPath $zipAsset -CompressionLevel Optimal
          Copy-Item -LiteralPath 'docs\releases\v0.1.0.md' -Destination $releaseNotes
          $assets = @($portableAsset, $zipAsset)
          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$(Split-Path -Leaf $asset)"
          }
          $checksumContents = ($lines -join "`n") + "`n"
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD $checksums),
            $checksumContents,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  publish:
    name: Publish trusted artifacts
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: release-assets

      - name: Verify release checksums
        shell: bash
        working-directory: release-assets
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS.txt

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          portable="release-assets/ScreenLingo-${version}-x64.exe"
          zip="release-assets/ScreenLingo-${version}-win-x64.zip"
          checksums="release-assets/SHA256SUMS.txt"
          releaseNotes="release-assets/release-notes.md"

          for asset in "$portable" "$zip" "$checksums" "$releaseNotes"; do
            if [[ ! -f "$asset" ]]; then
              echo "Missing release asset: $asset" >&2
              exit 1
            fi
          done

          arguments=(
            release create "$GITHUB_REF_NAME"
            --repo "$GH_REPO"
            --title "ScreenLingo $GITHUB_REF_NAME"
            --notes-file "$releaseNotes"
            --latest
            --verify-tag
          )
          arguments+=("$portable" "$zip" "$checksums")
          gh "${arguments[@]}"
